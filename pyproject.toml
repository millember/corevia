[project]
name = "corevia"
version = "0.1.0"
description = "Corevia — локальная кроссплатформенная платформа для автоматизации, планирования задач, управления сетью и проксирования."
readme = "README.md"
authors = [
    { name = "niyaz", email = "cashap.niyaz20@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
corevia = "corevia.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["corevia"]
