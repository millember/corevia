[project]
name = "corevia"
version = "0.1.0"
description = "Corevia — локальная кроссплатформенная платформа для автоматизации, планирования задач, управления сетью и проксирования."
readme = "README.md"
authors = [
    { name = "niyaz", email = "cashap.niyaz20@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyside6>=6.11.2",
]

[project.scripts]
corevia = "corevia.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["corevia"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.format]
indent-style = "space"
line-ending = "lf"
quote-style = "double"
