repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint with automatic fixes
        entry: uv run ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: Ruff format
        entry: uv run ruff format
        language: system
        types: [python]

      - id: compileall
        name: Python compilation
        entry: uv run python -m compileall -q corevia tests
        language: system
        pass_filenames: false
        always_run: true

      - id: pytest
        name: Pytest
        entry: uv run pytest -q
        language: system
        pass_filenames: false
        always_run: true
